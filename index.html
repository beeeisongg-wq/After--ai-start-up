/* ??? Loading Overlay ??????????????????????????? */
.loading-overlay {
  position: fixed; inset: 0; z-index: 9999;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  background: rgba(8, 10, 24, 0.88);
  backdrop-filter: blur(12px);
  animation: fadeIn 0.3s ease;
}
.loading-orb {
  width: 60px; height: 60px;
  border-radius: 50%;
  border: 2px solid transparent;
  border-top-color: var(--lavender);
  border-right-color: var(--lavender-light);
  animation: spin 1s linear infinite;
  box-shadow: 0 0 30px rgba(155,142,196,0.4);
  margin-bottom: var(--space-5);
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  font-family: var(--font-serif);
  color: var(--lavender-light);
  font-size: 1rem;
  letter-spacing: 0.1em;
}

/* ??? Toast ???????????????????????????????????? */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%);
  z-index: 10000;
  padding: 12px 24px;
  border-radius: var(--radius-full);
  font-size: 0.88rem;
  font-weight: 500;
  white-space: nowrap;
  animation: toastIn 0.3s ease;
  backdrop-filter: blur(12px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}
.toast.success { background: rgba(74,124,89,0.9); color: #fff; border: 1px solid rgba(74,124,89,0.5); }
.toast.error   { background: rgba(200,75,75,0.9);  color: #fff; border: 1px solid rgba(200,75,75,0.5); }
.toast.info    { background: rgba(61,107,156,0.9); color: #fff; border: 1px solid rgba(61,107,156,0.5); }
@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(16px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* ??? Modal ???????????????????????????????????? */
.modal-overlay {
  position: fixed; inset: 0; z-index: 8000;
  background: rgba(0,0,0,0.65);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  padding: var(--space-4);
  animation: fadeIn 0.25s ease;
}
.modal {
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-2xl);
  padding: var(--space-8) var(--space-7);
  width: 100%; max-width: 440px;
  max-height: 90vh; overflow-y: auto;
  position: relative;
  box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  animation: slideUp 0.3s ease;
}
@keyframes slideUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
.modal-close {
  position: absolute; top: var(--space-4); right: var(--space-4);
  background: transparent; border: none; cursor: pointer;
  color: var(--text-muted); font-size: 1rem;
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.modal-close:hover { background: rgba(255,255,255,0.08); color: var(--text-primary); }

/* ??? Nav ?????????????????????????????????????? */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: rgba(8,10,24,0.7);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.04);
  transition: all 0.3s ease;
}
.nav.scrolled {
  background: rgba(8,10,24,0.92);
  border-bottom-color: var(--border);
  box-shadow: 0 4px 24px rgba(0,0,0,0.3);
}
.nav-inner {
  max-width: 1200px; margin: 0 auto;
  padding: 0 var(--space-6);
  height: 64px; display: flex; align-items: center; gap: var(--space-8);
}
.nav-logo {
  font-family: var(--font-serif); font-size: 1.4rem; font-weight: 700;
  background: var(--gradient-gold);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; text-decoration: none; letter-spacing: 0.08em;
}
.nav-links { display: flex; gap: var(--space-2); flex: 1; }
@media (max-width: 768px) { .nav-links { display: none; } }
.nav-link {
  color: var(--text-secondary); font-size: 0.88rem; font-weight: 500;
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-md);
  text-decoration: none; transition: all 0.2s;
}
.nav-link:hover { color: var(--text-primary); background: rgba(255,255,255,0.06); }
.nav-link.active { color: var(--lavender-light); background: rgba(155,142,196,0.12); }
.nav-actions { display: flex; gap: var(--space-3); align-items: center; margin-left: auto; }
.nav-hamburger {
  display: none;
  @media (max-width: 768px) { display: flex; }
  background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); cursor: pointer;
}
.nav-mobile {
  display: none; flex-direction: column; gap: var(--space-1);
  padding: var(--space-4) var(--space-6) var(--space-5);
  background: rgba(8,10,24,0.95); border-bottom: 1px solid var(--border);
}
.nav-mobile.open { display: flex; }

/* ??? Hero ????????????????????????????????????? */
.hero {
  min-height: 100vh; position: relative;
  display: flex; align-items: center; justify-content: center;
  padding: 120px var(--space-6) 80px;
  overflow: hidden; text-align: center;
}
.hero-bg {
  position: absolute; inset: 0; overflow: hidden;
  background: radial-gradient(ellipse at center top, rgba(61,107,156,0.2) 0%, transparent 70%),
              radial-gradient(ellipse at 80% 80%, rgba(155,142,196,0.1) 0%, transparent 60%),
              var(--bg-deep);
}
.hero-bg img {
  width: 100%; height: 100%; object-fit: cover; opacity: 0.25;
}
#particles-canvas {
  position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
}
.hero-content { position: relative; z-index: 2; max-width: 700px; }
.hero-eyebrow {
  font-size: 0.78rem; letter-spacing: 0.2em;
  color: var(--lavender-light); margin-bottom: var(--space-5);
}
.hero-title {
  font-family: var(--font-serif); font-size: clamp(2.2rem, 6vw, 3.8rem);
  font-weight: 700; line-height: 1.25; margin-bottom: var(--space-5);
}
.hero-slogan {
  font-size: clamp(0.92rem, 2vw, 1.05rem); color: var(--text-secondary);
  line-height: 1.8; margin-bottom: var(--space-8);
}
.hero-actions { display: flex; gap: var(--space-4); justify-content: center; flex-wrap: wrap; }
.hero-scroll {
  position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
  display: flex; flex-direction: column; align-items: center; gap: var(--space-2);
  font-size: 0.65rem; letter-spacing: 0.2em; color: var(--text-muted); z-index: 2;
}
.hero-scroll-line {
  width: 1px; height: 40px;
  background: linear-gradient(to bottom, transparent, var(--lavender));
  animation: pulse 2s ease-in-out infinite;
}

/* ??? Stats Bar ???????????????????????????????? */
.stats-bar {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: var(--space-1); padding: var(--space-6);
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-2xl);
}
@media (max-width: 600px) { .stats-bar { grid-template-columns: repeat(2, 1fr); } }
.stat-item { text-align: center; padding: var(--space-4); }
.stat-number { font-family: var(--font-serif); font-size: 1.8rem; font-weight: 700; }
.stat-label { font-size: 0.78rem; color: var(--text-muted); margin-top: var(--space-1); }

/* ??? Service Grid ????????????????????????????? */
.service-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-6); }
@media (max-width: 900px) { .service-grid { grid-template-columns: 1fr; } }
.service-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-2xl); padding: var(--space-7);
  cursor: pointer; transition: all 0.3s ease; position: relative; overflow: hidden;
}
.service-card::before {
  content: ''; position: absolute; inset: 0;
  background: var(--gradient-glow); opacity: 0; transition: opacity 0.3s;
}
.service-card:hover { border-color: var(--border-strong); transform: translateY(-4px); box-shadow: var(--shadow-xl); }
.service-card:hover::before { opacity: 1; }
.service-icon {
  width: 56px; height: 56px; border-radius: var(--radius-lg);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem; margin-bottom: var(--space-5);
}
.service-card-title { font-family: var(--font-serif); font-size: 1.15rem; font-weight: 700; margin-bottom: var(--space-3); }
.service-card-desc { font-size: 0.87rem; color: var(--text-secondary); line-height: 1.7; margin-bottom: var(--space-4); }
.service-card-tags { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.service-tag {
  font-size: 0.72rem; padding: 3px 10px; border-radius: var(--radius-full);
  background: rgba(255,255,255,0.05); color: var(--text-muted);
  border: 1px solid rgba(255,255,255,0.08);
}

/* ??? Ohaeng Demo ?????????????????????????????? */
.ohaeng-demo { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-2xl); padding: var(--space-8); }
.ohaeng-demo-inner { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-8); align-items: start; }
@media (max-width: 768px) { .ohaeng-demo-inner { grid-template-columns: 1fr; } }
.ohaeng-symbols {
  display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr);
  gap: var(--space-3); max-width: 280px; margin: 0 auto;
}
.ohaeng-symbol {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: var(--space-4); border-radius: var(--radius-xl); border: 1px solid rgba(255,255,255,0.08);
  cursor: pointer; transition: all 0.3s; aspect-ratio: 1;
}
.ohaeng-symbol:hover { transform: scale(1.05); border-color: rgba(255,255,255,0.2); }
.ohaeng-symbol.selected { border-color: var(--lavender); box-shadow: 0 0 20px rgba(155,142,196,0.3); transform: scale(1.05); }
.ohaeng-symbol-char { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 700; }
.ohaeng-symbol-name { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
.bg-ohaeng-紐?{ background: rgba(74,124,89,0.15); }
.bg-ohaeng-??{ background: rgba(200,75,75,0.15); }
.bg-ohaeng-??{ background: rgba(212,168,83,0.15); }
.bg-ohaeng-湲?{ background: rgba(200,214,229,0.1); }
.bg-ohaeng-??{ background: rgba(61,107,156,0.15); }
.bg-ohaeng-wood { background: rgba(74,124,89,0.15); }
.bg-ohaeng-fire { background: rgba(200,75,75,0.15); }
.bg-ohaeng-earth { background: rgba(212,168,83,0.15); }
.bg-ohaeng-metal { background: rgba(200,214,229,0.1); }
.bg-ohaeng-water { background: rgba(61,107,156,0.15); }
.ohaeng-wood { color: var(--wood); }
.ohaeng-fire { color: var(--fire); }
.ohaeng-earth { color: var(--earth); }
.ohaeng-metal { color: var(--metal); }
.ohaeng-water { color: var(--water); }
.ohaeng-result { background: rgba(255,255,255,0.02); border-radius: var(--radius-xl); padding: var(--space-5); min-height: 200px; }

/* ??? Pricing ?????????????????????????????????? */
.pricing-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: var(--space-5); }
@media (max-width:1100px) { .pricing-grid { grid-template-columns: repeat(2,1fr); } }
@media (max-width:600px)  { .pricing-grid { grid-template-columns: 1fr; } }
.pricing-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-2xl); padding: var(--space-7);
  position: relative; transition: all 0.3s;
}
.pricing-card.featured {
  border-color: rgba(155,142,196,0.4);
  box-shadow: 0 0 30px rgba(155,142,196,0.1), var(--shadow-lg);
  background: linear-gradient(135deg, rgba(155,142,196,0.06) 0%, var(--bg-card) 100%);
}
.pricing-badge { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); white-space: nowrap; }
.pricing-tier { font-size: 0.72rem; letter-spacing: 0.15em; color: var(--silver); font-weight: 700; margin-bottom: var(--space-3); }
.pricing-price { margin-bottom: var(--space-2); }
.pricing-amount { font-family: var(--font-serif); font-size: 2rem; font-weight: 700; }
.pricing-unit { font-size: 0.82rem; color: var(--text-muted); margin-left: 4px; }
.pricing-desc { font-size: 0.82rem; color: var(--text-muted); margin-bottom: var(--space-5); }
.pricing-features { list-style: none; padding: 0; margin: 0 0 var(--space-6); display: flex; flex-direction: column; gap: var(--space-2); }
.pricing-feature { display: flex; gap: var(--space-2); font-size: 0.85rem; color: var(--text-secondary); }
.pricing-check { color: var(--lavender-light); font-weight: 700; }
.text-gold { background: var(--gradient-gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

/* ??? Reviews ?????????????????????????????????? */
.reviews-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: var(--space-5); }
@media (max-width:900px) { .reviews-grid { grid-template-columns: 1fr; } }
.review-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-2xl); padding: var(--space-6);
}
.review-stars { margin-bottom: var(--space-3); font-size: 0.85rem; }
.review-text { font-size: 0.88rem; color: var(--text-secondary); line-height: 1.8; margin-bottom: var(--space-5); font-style: italic; }
.review-author { display: flex; align-items: center; gap: var(--space-3); }
.review-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--gradient-main); display: flex; align-items: center;
  justify-content: center; font-size: 0.85rem; font-weight: 700;
}
.review-name { font-size: 0.85rem; font-weight: 600; }
.review-meta { font-size: 0.75rem; color: var(--text-muted); }

/* ??? CTA Banner ??????????????????????????????? */
.cta-banner {
  background: var(--bg-card); border: 1px solid var(--border-strong);
  border-radius: var(--radius-2xl); padding: var(--space-12) var(--space-8);
  text-align: center; position: relative; overflow: hidden;
  background: linear-gradient(135deg, rgba(61,107,156,0.08) 0%, rgba(155,142,196,0.06) 50%, rgba(212,168,83,0.04) 100%);
}
.cta-actions { display: flex; gap: var(--space-4); justify-content: center; flex-wrap: wrap; }

/* ??? Saju Page ???????????????????????????????? */
.page-header {
  padding: 120px var(--space-6) var(--space-10);
  text-align: center; max-width: 700px; margin: 0 auto;
}
.page-header h1 { font-family: var(--font-serif); font-size: clamp(1.8rem,5vw,2.8rem); font-weight: 700; margin: var(--space-3) 0; }
.page-header p { color: var(--text-secondary); font-size: 0.95rem; line-height: 1.7; }
.page-header-badge { margin-bottom: var(--space-3); }

.saju-layout { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); margin-bottom: var(--space-10); }
@media (max-width:900px) { .saju-layout { grid-template-columns: 1fr; } }
.saju-form-card, .saju-result-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-2xl); padding: var(--space-7);
}
.saju-form-title { font-family: var(--font-serif); font-size: 1.1rem; font-weight: 700; margin-bottom: var(--space-6); }
.saju-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); margin-bottom: var(--space-5); }
.saju-form-grid .full { grid-column: 1 / -1; }
@media (max-width:500px) { .saju-form-grid { grid-template-columns: 1fr; } .saju-form-grid .full { grid-column: 1; } }
.saju-time-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: var(--space-2); }
@media (max-width:500px) { .saju-time-grid { grid-template-columns: repeat(4,1fr); } }
.saju-time-btn {
  padding: var(--space-2); border-radius: var(--radius-md);
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
  color: var(--text-secondary); font-size: 0.72rem; text-align: center;
  cursor: pointer; transition: all 0.2s;
}
.saju-time-btn:hover { background: rgba(155,142,196,0.1); border-color: rgba(155,142,196,0.3); }
.saju-time-btn.selected { background: rgba(155,142,196,0.15); border-color: var(--lavender); color: var(--lavender-light); }
.saju-result-placeholder { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 360px; color: var(--text-muted); text-align: center; }
.saju-result-icon { font-size: 3rem; margin-bottom: var(--space-4); animation: float 3s ease-in-out infinite; }
.saju-ai-section { background: rgba(155,142,196,0.06); border: 1px solid rgba(155,142,196,0.15); border-radius: var(--radius-xl); padding: var(--space-5); }
.saju-ai-title { font-size: 0.85rem; font-weight: 700; color: var(--lavender-light); margin-bottom: var(--space-3); }
.saju-ai-text { font-size: 0.88rem; color: var(--text-secondary); line-height: 1.85; }
.saju-upgrade-banner {
  background: linear-gradient(135deg, rgba(212,168,83,0.08) 0%, rgba(155,142,196,0.06) 100%);
  border: 1px solid rgba(212,168,83,0.2); border-radius: var(--radius-xl); padding: var(--space-6);
  text-align: center; overflow: hidden;
}

/* ??? Steps ???????????????????????????????????? */
.steps { display: flex; align-items: center; gap: 0; }
.step { display: flex; align-items: center; gap: var(--space-2); opacity: 0.4; transition: opacity 0.3s; }
.step.active { opacity: 1; }
.step-num {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(155,142,196,0.15); border: 1px solid rgba(155,142,196,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.78rem; font-weight: 700;
}
.step.active .step-num { background: var(--lavender); border-color: var(--lavender); color: white; }
.step span { font-size: 0.78rem; color: var(--text-muted); }
.step-line { flex: 1; height: 1px; background: var(--border); min-width: 20px; }

/* ??? Saju Pillars ????????????????????????????? */
.pillar-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: var(--space-3); }
@media (max-width:500px) { .pillar-grid { grid-template-columns: repeat(2,1fr); } }
.pillar-card {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
  border-radius: var(--radius-xl); padding: var(--space-4); text-align: center;
}
.pillar-label { font-size: 0.7rem; color: var(--text-muted); margin-bottom: var(--space-2); }
.pillar-gan { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 700; }
.pillar-ji { font-family: var(--font-serif); font-size: 1.4rem; font-weight: 600; }
.pillar-sub { font-size: 0.7rem; color: var(--text-muted); margin-top: var(--space-1); }

/* ??? Ohaeng Bar ??????????????????????????????? */
.ohaeng-bar-wrapper { display: flex; flex-direction: column; gap: var(--space-3); }
.ohaeng-bar-item { display: grid; grid-template-columns: 24px 1fr 40px; gap: var(--space-3); align-items: center; }
.ohaeng-bar-label { font-family: var(--font-serif); font-size: 1rem; font-weight: 700; text-align: center; }
.ohaeng-bar-track { height: 8px; background: rgba(255,255,255,0.06); border-radius: var(--radius-full); overflow: hidden; }
.ohaeng-bar-fill { height: 100%; border-radius: var(--radius-full); transition: width 1s cubic-bezier(0.4,0,0.2,1); width: 0; }
.ohaeng-bar-pct { font-size: 0.78rem; color: var(--text-muted); text-align: right; }

/* ??? Goonghap ????????????????????????????????? */
.goonghap-inputs { display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--space-5); align-items: start; margin-bottom: var(--space-8); }
@media (max-width:768px) { .goonghap-inputs { grid-template-columns: 1fr; } }
.person-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-2xl); padding: var(--space-6); }
.person-card-header { display: flex; align-items: center; gap: var(--space-4); margin-bottom: var(--space-5); }
.person-avatar { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
.person-label { font-family: var(--font-serif); font-size: 1rem; font-weight: 700; }
.person-sublabel { font-size: 0.78rem; color: var(--text-muted); }
.goonghap-vs {
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-serif); font-size: 1.5rem; font-weight: 700;
  color: var(--lavender-light); padding-top: var(--space-10);
}
.goonghap-score-section {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-2xl); padding: var(--space-10);
  text-align: center; margin-bottom: var(--space-8);
}
.goonghap-score-circle {
  width: 130px; height: 130px; border-radius: 50%;
  border: 3px solid rgba(155,142,196,0.3);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  margin: 0 auto var(--space-5);
  background: radial-gradient(circle, rgba(155,142,196,0.08) 0%, transparent 70%);
  box-shadow: 0 0 40px rgba(155,142,196,0.15);
}
.goonghap-score-num { font-family: var(--font-serif); font-size: 2.8rem; font-weight: 700; }
.goonghap-score-label { font-size: 0.78rem; color: var(--text-muted); }
.goonghap-aspects { display: grid; grid-template-columns: repeat(3,1fr); gap: var(--space-4); }
@media (max-width:768px) { .goonghap-aspects { grid-template-columns: repeat(2,1fr); } }
@media (max-width:480px) { .goonghap-aspects { grid-template-columns: 1fr; } }
.aspect-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: var(--space-5); text-align: center; }
.aspect-icon { font-size: 1.4rem; margin-bottom: var(--space-2); }
.aspect-title { font-size: 0.82rem; color: var(--text-muted); margin-bottom: var(--space-2); }
.aspect-score { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 700; margin-bottom: var(--space-2); }
.aspect-score-bar { height: 4px; background: rgba(255,255,255,0.06); border-radius: var(--radius-full); overflow: hidden; }
.aspect-score-fill { height: 100%; border-radius: var(--radius-full); transition: width 1s ease; }

/* ??? Tarot ???????????????????????????????????? */
.tarot-concern-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: var(--space-4); margin-bottom: var(--space-10); }
@media (max-width:900px) { .tarot-concern-grid { grid-template-columns: repeat(2,1fr); } }
@media (max-width:480px) { .tarot-concern-grid { grid-template-columns: repeat(2,1fr); } }
.tarot-concern-btn {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-2xl); padding: var(--space-5) var(--space-4);
  text-align: center; cursor: pointer; transition: all 0.3s;
}
.tarot-concern-btn:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: var(--shadow-md); }
.tarot-concern-btn.selected { border-color: var(--lavender); background: rgba(155,142,196,0.1); box-shadow: 0 0 20px rgba(155,142,196,0.2); }
.tarot-concern-icon { font-size: 1.8rem; margin-bottom: var(--space-2); }
.tarot-concern-name { font-weight: 600; font-size: 0.9rem; margin-bottom: 4px; }
.tarot-spread { display: flex; gap: var(--space-6); justify-content: center; flex-wrap: wrap; margin-bottom: var(--space-8); }
.tarot-slot { display: flex; flex-direction: column; align-items: center; gap: var(--space-3); }
.tarot-slot-label { font-size: 0.78rem; color: var(--text-muted); }
.tarot-scene { perspective: 800px; }
.tarot-card-unselected {
  width: 90px; height: 140px; border-radius: var(--radius-xl);
  background: rgba(255,255,255,0.04); border: 2px dashed rgba(155,142,196,0.3);
  display: flex; align-items: center; justify-content: center;
}
.tarot-card-container {
  width: 90px; height: 140px; position: relative;
  transform-style: preserve-3d; transition: transform 0.7s cubic-bezier(0.4,0,0.2,1);
  border-radius: var(--radius-xl); cursor: pointer;
}
.tarot-card-container.flipped { transform: rotateY(180deg); }
.tarot-back, .tarot-face {
  position: absolute; inset: 0; border-radius: var(--radius-xl);
  backface-visibility: hidden; overflow: hidden;
}
.tarot-back {
  background: linear-gradient(135deg, #1A2035, #0E1228);
  border: 1px solid rgba(155,142,196,0.2);
}
.tarot-back img { width: 100%; height: 100%; object-fit: cover; }
.tarot-face {
  transform: rotateY(180deg);
  background: linear-gradient(135deg, #1A2035, #0E1228);
  border: 1px solid rgba(155,142,196,0.3);
}
.tarot-face-inner { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--space-2); gap: 4px; }
.tarot-face-symbol { font-size: 1.6rem; }
.tarot-face-name { font-size: 0.62rem; text-align: center; color: var(--lavender-light); font-family: var(--font-serif); }
.tarot-deck-area { display: flex; flex-direction: column; align-items: center; gap: var(--space-4); }
.tarot-deck-stack { position: relative; width: 100px; height: 156px; cursor: pointer; }
.tarot-deck-card {
  position: absolute; width: 92px; height: 148px; border-radius: var(--radius-xl);
  background: linear-gradient(135deg, #1A2035, #0E1228);
  border: 1px solid rgba(155,142,196,0.25); overflow: hidden;
  transition: transform 0.2s;
}
.tarot-deck-card:nth-child(1) { top: 0; left: 0; }
.tarot-deck-card:nth-child(2) { top: 3px; left: 3px; }
.tarot-deck-card:nth-child(3) { top: 6px; left: 6px; }
.tarot-deck-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }
.tarot-deck-stack:hover .tarot-deck-card:last-child { transform: translateY(-4px) rotate(-3deg); }
.tarot-reading { display: flex; flex-direction: column; gap: var(--space-5); }
.tarot-reading-card {
  display: grid; grid-template-columns: 80px 1fr; gap: var(--space-5);
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-2xl); padding: var(--space-6);
  animation: fadeIn 0.5s ease both;
}
@media (max-width:480px) { .tarot-reading-card { grid-template-columns: 1fr; } }
.tarot-reading-img {
  width: 80px; height: 120px; border-radius: var(--radius-lg);
  background: linear-gradient(135deg, rgba(155,142,196,0.15) 0%, rgba(61,107,156,0.1) 100%);
  border: 1px solid rgba(155,142,196,0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.5rem;
}
.tarot-reading-pos { font-size: 0.72rem; color: var(--lavender-light); letter-spacing: 0.1em; margin-bottom: var(--space-1); }
.tarot-reading-name { font-family: var(--font-serif); font-size: 1.1rem; font-weight: 700; margin-bottom: var(--space-3); }
.tarot-reading-text { font-size: 0.88rem; color: var(--text-secondary); line-height: 1.8; }

/* ??? Store ???????????????????????????????????? */
.store-filters { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-8); }
.store-filter-btn {
  padding: var(--space-2) var(--space-4); border-radius: var(--radius-full);
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
  color: var(--text-secondary); font-size: 0.85rem; cursor: pointer; transition: all 0.2s;
}
.store-filter-btn:hover { border-color: var(--border-strong); color: var(--text-primary); }
.store-filter-btn.active { background: rgba(155,142,196,0.15); border-color: var(--lavender); color: var(--lavender-light); }
.product-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: var(--space-5); }
@media (max-width:900px) { .product-grid { grid-template-columns: repeat(2,1fr); } }
@media (max-width:480px) { .product-grid { grid-template-columns: 1fr; } }
.product-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-2xl); overflow: hidden;
  transition: all 0.3s; cursor: pointer;
}
.product-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-xl); border-color: var(--border-strong); }
.product-img {
  aspect-ratio: 1; background: rgba(255,255,255,0.02);
  position: relative; overflow: hidden;
}
.product-img img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
.product-card:hover .product-img img { transform: scale(1.04); }
.product-ohaeng-tag {
  position: absolute; top: 10px; left: 10px;
  font-size: 0.7rem; padding: 3px 10px; border-radius: var(--radius-full);
  background: rgba(8,10,24,0.8); backdrop-filter: blur(4px);
}
.product-wishlist {
  position: absolute; top: 10px; right: 10px;
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(8,10,24,0.8); backdrop-filter: blur(4px);
  border: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 0.9rem; transition: transform 0.2s;
}
.product-wishlist:hover { transform: scale(1.15); }
.product-info { padding: var(--space-5); }
.product-category { font-size: 0.72rem; color: var(--text-muted); margin-bottom: var(--space-1); }
.product-name { font-size: 0.95rem; font-weight: 600; margin-bottom: var(--space-2); }
.product-desc { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.6; margin-bottom: var(--space-3); }
.product-footer { display: flex; align-items: center; justify-content: space-between; }
.product-price { font-family: var(--font-serif); font-size: 1.05rem; font-weight: 700; }
.product-cart-btn {
  width: 36px; height: 36px; border-radius: var(--radius-md);
  background: rgba(155,142,196,0.15); border: 1px solid rgba(155,142,196,0.3);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 0.9rem; transition: all 0.2s;
}
.product-cart-btn:hover { background: rgba(155,142,196,0.3); border-color: var(--lavender); }

/* ??? Cart Sidebar ????????????????????????????? */
.cart-sidebar {
  position: fixed; right: 0; top: 0; bottom: 0; z-index: 7000;
  width: 360px; max-width: 100vw;
  background: var(--bg-card); border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  box-shadow: var(--shadow-xl);
}
.cart-sidebar.open { transform: translateX(0); }
.cart-header { padding: var(--space-5) var(--space-5) var(--space-4); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.cart-title { font-family: var(--font-serif); font-size: 1rem; font-weight: 700; }
.cart-items { flex: 1; overflow-y: auto; padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
.cart-item { display: flex; align-items: center; gap: var(--space-3); background: rgba(255,255,255,0.03); border-radius: var(--radius-xl); padding: var(--space-3); }
.cart-item-img { width: 56px; height: 56px; border-radius: var(--radius-md); overflow: hidden; background: rgba(255,255,255,0.05); }
.cart-item-img img { width: 100%; height: 100%; object-fit: cover; }
.cart-item-name { font-size: 0.85rem; font-weight: 600; margin-bottom: 2px; }
.cart-item-ohaeng { font-size: 0.72rem; color: var(--lavender-light); margin-bottom: 4px; }
.cart-item-price { font-size: 0.82rem; color: var(--text-muted); }
.cart-item-remove { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.85rem; padding: 4px; transition: color 0.2s; }
.cart-item-remove:hover { color: var(--fire); }
.cart-footer { padding: var(--space-5); border-top: 1px solid var(--border); }
.cart-total { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-4); }
.cart-total-label { color: var(--text-secondary); }
.cart-total-price { font-family: var(--font-serif); font-size: 1.2rem; font-weight: 700; color: var(--gold); }
.btn-gold {
  background: var(--gradient-gold); color: var(--bg-deep); font-weight: 700;
  border: none; border-radius: var(--radius-lg); padding: var(--space-3) var(--space-6);
  cursor: pointer; transition: all 0.2s;
}
.btn-gold:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-gold.btn-sm { padding: var(--space-2) var(--space-4); font-size: 0.85rem; }
.btn-gold.btn-lg { padding: var(--space-4) var(--space-8); font-size: 1rem; }

/* ??? MyPage ??????????????????????????????????? */
.mypage-layout { display: grid; grid-template-columns: 240px 1fr; gap: var(--space-8); margin-bottom: var(--space-10); }
@media (max-width:900px) { .mypage-layout { grid-template-columns: 1fr; } }
.mypage-sidebar { position: sticky; top: 90px; align-self: start; }
.mypage-profile { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-2xl); padding: var(--space-6); text-align: center; margin-bottom: var(--space-4); }
.mypage-avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--gradient-main); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto var(--space-3); }
.mypage-name { font-family: var(--font-serif); font-size: 1.05rem; font-weight: 700; }
.mypage-email { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
.mypage-nav { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-2xl); padding: var(--space-3); }
.mypage-nav-item {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3) var(--space-4); border-radius: var(--radius-xl);
  cursor: pointer; transition: all 0.2s; color: var(--text-secondary); font-size: 0.88rem;
}
.mypage-nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text-primary); }
.mypage-nav-item.active { background: rgba(155,142,196,0.12); color: var(--lavender-light); font-weight: 600; }
.mypage-nav-icon { font-size: 1rem; }
.mypage-content { min-height: 400px; }
.mypage-section-title { font-family: var(--font-serif); font-size: 1.1rem; font-weight: 700; margin-bottom: var(--space-5); }
.analysis-history-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: var(--space-4); }
@media (max-width:600px) { .analysis-history-grid { grid-template-columns: 1fr; } }
.analysis-history-card {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-xl);
  padding: var(--space-5); cursor: pointer; transition: all 0.2s;
}
.analysis-history-card:hover { border-color: var(--border-strong); transform: translateY(-2px); }
.analysis-history-type { font-size: 0.72rem; color: var(--lavender-light); font-weight: 700; margin-bottom: var(--space-1); }
.analysis-history-title { font-weight: 600; font-size: 0.9rem; margin-bottom: var(--space-1); }
.analysis-history-date { font-size: 0.75rem; color: var(--text-muted); margin-bottom: var(--space-2); }
.analysis-history-preview { font-size: 0.82rem; color: var(--text-secondary); }
.order-table { width: 100%; border-collapse: collapse; }
.order-table th { padding: var(--space-3) var(--space-4); text-align: left; font-size: 0.78rem; color: var(--text-muted); border-bottom: 1px solid var(--border); }
.order-table td { padding: var(--space-4); font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.04); }
.order-status { padding: 3px 12px; border-radius: var(--radius-full); font-size: 0.72rem; font-weight: 600; }
.order-status.delivered { background: rgba(74,124,89,0.15); color: #4A7C59; }
.order-status.shipping { background: rgba(61,107,156,0.15); color: #3D6B9C; }
.order-status.processing { background: rgba(212,168,83,0.15); color: #D4A853; }

/* ??? Report ??????????????????????????????????? */
.report-header-card {
  background: var(--bg-card); border: 1px solid var(--border-strong);
  border-radius: var(--radius-2xl); padding: var(--space-8);
  text-align: center; margin-bottom: var(--space-8);
  background: linear-gradient(135deg, rgba(155,142,196,0.08) 0%, var(--bg-card) 100%);
}
.report-type-badge { margin-bottom: var(--space-3); }
.report-person-name { font-family: var(--font-serif); font-size: 1.6rem; font-weight: 700; margin-bottom: var(--space-2); }
.report-person-meta { font-size: 0.85rem; color: var(--text-secondary); }
.report-generated { font-size: 0.75rem; color: var(--text-muted); margin-top: var(--space-2); }
.report-sections { display: flex; flex-direction: column; gap: var(--space-5); }
.report-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-2xl); padding: var(--space-7); }
.report-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-5); }
.report-section-title { display: flex; align-items: center; gap: var(--space-3); font-family: var(--font-serif); font-size: 1rem; font-weight: 700; }
.report-section-icon { width: 36px; height: 36px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 1rem; }
.report-text { font-size: 0.9rem; color: var(--text-secondary); line-height: 1.9; }
.badge-free { background: rgba(74,124,89,0.15); color: #4A7C59; border: 1px solid rgba(74,124,89,0.3); padding: 3px 10px; border-radius: var(--radius-full); font-size: 0.72rem; font-weight: 700; }

/* ??? Auth Form ???????????????????????????????? */
.auth-form { display: flex; flex-direction: column; gap: var(--space-4); }
.auth-logo { }
.divider-label {
  display: flex; align-items: center; gap: var(--space-3);
  color: var(--text-muted); font-size: 0.8rem; margin: var(--space-2) 0;
}
.divider-label::before, .divider-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.divider { height: 1px; background: var(--border); margin: var(--space-5) 0; }

/* ??? Tabs ????????????????????????????????????? */
.tabs { display: flex; background: rgba(255,255,255,0.04); border-radius: var(--radius-lg); padding: 3px; }
.tab-btn {
  flex: 1; padding: var(--space-2) var(--space-4); border-radius: var(--radius-md);
  border: none; background: transparent; color: var(--text-muted);
  font-size: 0.88rem; cursor: pointer; transition: all 0.2s;
}
.tab-btn.active { background: var(--bg-card); color: var(--text-primary); box-shadow: 0 2px 8px rgba(0,0,0,0.2); font-weight: 600; }

/* ??? Privacy Notice ??????????????????????????? */
.privacy-notice {
  background: rgba(61,107,156,0.08); border: 1px solid rgba(61,107,156,0.2);
  border-radius: var(--radius-lg); padding: var(--space-4);
  font-size: 0.8rem; color: var(--text-secondary); line-height: 1.7;
}

/* ??? Form Elements ???????????????????????????? */
.form-hint { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; display: block; }

/* ??? Footer ??????????????????????????????????? */
.footer {
  border-top: 1px solid var(--border);
  background: rgba(8,10,24,0.8);
  padding: var(--space-12) 0 var(--space-8);
  margin-top: var(--space-10);
}
.footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: var(--space-8); margin-bottom: var(--space-8); }
@media (max-width:768px) { .footer-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width:480px) { .footer-grid { grid-template-columns: 1fr; } }
.footer-brand-name { font-family: var(--font-serif); font-size: 1.4rem; font-weight: 700; background: var(--gradient-gold); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: var(--space-3); }
.footer-desc { font-size: 0.82rem; color: var(--text-muted); line-height: 1.8; }
.footer-col-title { font-size: 0.78rem; font-weight: 700; color: var(--silver); letter-spacing: 0.1em; margin-bottom: var(--space-3); }
.footer-col-link { display: block; font-size: 0.82rem; color: var(--text-muted); text-decoration: none; margin-bottom: var(--space-2); transition: color 0.2s; }
.footer-col-link:hover { color: var(--text-primary); }
.footer-bottom { border-top: 1px solid rgba(255,255,255,0.04); padding-top: var(--space-6); }
.footer-copy { font-size: 0.8rem; color: var(--text-muted); margin-bottom: var(--space-2); }
.footer-disclaimer { font-size: 0.75rem; color: rgba(255,255,255,0.2); line-height: 1.6; }

/* ??? Card (generic) ??????????????????????????? */
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-2xl); padding: var(--space-7);
}

/* ??? Animate helpers ?????????????????????????? */
.animate-fadeUp {
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.6s ease, transform 0.6s ease;
}
.animate-fadeUp-delay-1 { transition-delay: 0.12s; }
.animate-fadeUp-delay-2 { transition-delay: 0.24s; }
.animate-fadeUp-delay-3 { transition-delay: 0.36s; }
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
@keyframes pulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to   { opacity: 1; }

const AppState = {
  currentPage: 'home',
  user: null, // { name, email, birth, ohaeng }
  cart: [],
  wishlist: [],
  analysisHistory: [],
  currentSaju: null,
  currentGoonghap: null,
  currentTarot: null,
  isLoading: false,

  // localStorage persistence
  save() {
    try {
      localStorage.setItem('after_state', JSON.stringify({
        user: this.user,
        cart: this.cart,
        wishlist: this.wishlist,
        analysisHistory: this.analysisHistory,
      }));
    } catch(e) {}
  },
  load() {
    try {
      const data = localStorage.getItem('after_state');
      if (data) {
        const parsed = JSON.parse(data);
        this.user = parsed.user || null;
        this.cart = parsed.cart || [];
        this.wishlist = parsed.wishlist || [];
        this.analysisHistory = parsed.analysisHistory || [];
      }
    } catch(e) {}
  },
};

// ??? Router ??????????????????????????????????????
const Router = {
  pages: {},
  register(id, renderFn) { this.pages[id] = renderFn; },
  navigate(pageId, params = {}) {
    AppState.currentPage = pageId;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    const main = document.getElementById('main-content');
    if (!main) return;

    const renderFn = this.pages[pageId];
    if (!renderFn) return;

    // First load or already rendered
    main.innerHTML = renderFn(params);
    main.style.opacity = '1';
    main.style.transform = 'translateY(0)';
    attachEventListeners(pageId, params);
    updateNavActive(pageId);
  },
};

function updateNavActive(pageId) {
  document.querySelectorAll('.nav-link').forEach(link => {
    link.classList.toggle('active', link.dataset.page === pageId);
  });
  document.querySelectorAll('.mypage-nav-item').forEach(item => {
    item.classList.toggle('active', item.dataset.section === pageId);
  });
}

// ??? Particles ???????????????????????????????????
function initParticles(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;

  const particles = Array.from({ length: 80 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.8 + 0.3,
    dx: (Math.random() - 0.5) * 0.3,
    dy: (Math.random() - 0.5) * 0.3,
    opacity: Math.random() * 0.7 + 0.2,
    twinkle: Math.random() * Math.PI * 2,
  }));

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.x += p.dx; p.y += p.dy; p.twinkle += 0.02;
      if (p.x < 0) p.x = canvas.width;
      if (p.x > canvas.width) p.x = 0;
      if (p.y < 0) p.y = canvas.height;
      if (p.y > canvas.height) p.y = 0;
      const alpha = p.opacity * (0.6 + 0.4 * Math.sin(p.twinkle));
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200, 214, 229, ${alpha})`;
      ctx.fill();
    });
    requestAnimationFrame(animate);
  }
  animate();

  window.addEventListener('resize', () => {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
  });
}

// ??? Toast ????????????????????????????????????????
function showToast(msg, type = 'info', duration = 3000) {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'toastIn 0.3s ease reverse';
    setTimeout(() => el.remove(), 300);
  }, duration);
}

// ??? Modal ????????????????????????????????????????
function openModal(html, { onClose } = {}) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-overlay';
  overlay.innerHTML = `<div class="modal" style="position:relative;">${html}</div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => {
    if (e.target === overlay) closeModal();
  });
  if (onClose) overlay._onClose = onClose;
  // Trap focus
  const firstInput = overlay.querySelector('input, button, select, textarea');
  if (firstInput) firstInput.focus();
}

function closeModal() {
  const overlay = document.getElementById('modal-overlay');
  if (overlay) {
    if (overlay._onClose) overlay._onClose();
    overlay.remove();
  }
}

// ??? Form Validation ??????????????????????????????
function validateRequired(fields) {
  let valid = true;
  fields.forEach(({ id, label }) => {
    const el = document.getElementById(id);
    const errEl = document.getElementById(`${id}-error`);
    if (!el) return;
    const val = el.value.trim();
    if (!val) {
      if (errEl) errEl.textContent = `${label}??瑜? ?낅젰?댁＜?몄슂.`;
      el.style.borderColor = 'var(--fire)';
      valid = false;
    } else {
      if (errEl) errEl.textContent = '';
      el.style.borderColor = '';
    }
  });
  return valid;
}

function validateEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function addToCart(product) {
  const exists = AppState.cart.find(i => i.id === product.id);
  if (exists) {
    exists.qty = (exists.qty || 1) + 1;
  } else {
    AppState.cart.push({ ...product, qty: 1 });
  }
  AppState.save();
  updateCartBadge();
  showToast(`?썚截?${product.name}???λ컮援щ땲???닿꼈?듬땲??`, 'success');
}

function removeFromCart(productId) {
  AppState.cart = AppState.cart.filter(i => i.id !== productId);
  AppState.save();
  updateCartBadge();
}

function updateCartBadge() {
  const badge = document.getElementById('cart-badge');
  const count = AppState.cart.reduce((a, b) => a + (b.qty || 1), 0);
  if (badge) {
    badge.textContent = count;
    badge.style.display = count > 0 ? 'flex' : 'none';
  }
}

function toggleWishlist(productId) {
  const idx = AppState.wishlist.indexOf(productId);
  if (idx === -1) {
    AppState.wishlist.push(productId);
    showToast('?ㅿ툘 李?紐⑸줉??異붽??먯뒿?덈떎.', 'success');
  } else {
    AppState.wishlist.splice(idx, 1);
    showToast('李?紐⑸줉?먯꽌 ?쒓굅?먯뒿?덈떎.', 'info');
  }
  AppState.save();
}

// ??? Intersection Observer (scroll animations) ????
function initScrollAnimations() {
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.style.opacity = '1';
        entry.target.style.transform = 'translateY(0)';
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });

  document.querySelectorAll('.animate-fadeUp').forEach(el => observer.observe(el));
}

// ??? Ohaeng Bar Animation ?????????????????????????
function animateOhaengBars(data, containerSelector) {
  const container = document.querySelector(containerSelector);
  if (!container) return;
  const bars = container.querySelectorAll('.ohaeng-bar-fill');
  const pcts = container.querySelectorAll('.ohaeng-bar-pct');
  setTimeout(() => {
    bars.forEach((bar, i) => {
      const pct = data[i] || 0;
      bar.style.width = `${pct}%`;
      if (pcts[i]) pcts[i].textContent = `${pct}%`;
    });
  }, 300);
}

function analyzeSaju() {

  [['saju-year','?앸뀈'],['saju-month','?앹썡'],['saju-day','?앹씪'],['saju-gender','?깅퀎']].forEach(([id,label])=>{

    if (nav) nav.classList.toggle('scrolled', window.scrollY > 40);
  });

  // Handle browser back/forward (hash-based)
  const hash = window.location.hash.replace('#/', '');
  const validPages = ['home', 'saju', 'goonghap', 'tarot', 'store', 'mypage', 'report'];

  Router.navigate(startPage);
}

document.addEventListener('click', (e) => {
  const sidebar = document.getElementById('cart-sidebar');
  if (sidebar && sidebar.classList.contains('open') && !sidebar.contains(e.target)) {

    if (!cartBtn) sidebar.classList.remove('open');

});
